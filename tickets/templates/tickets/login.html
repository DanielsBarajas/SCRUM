{% extends "tickets/base.html" %}
{% block title %}Iniciar sesión · Nexo{% endblock %}
{% block content %}
<div class="mx-auto mt-12 max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
  <p class="text-sm font-semibold uppercase tracking-widest text-blue-700">Nexo</p>
  <h1 class="mt-2 text-2xl font-bold">Acceso al soporte interno</h1>
  <p class="mt-2 text-sm text-slate-500">Ingresa con tu cuenta organizacional.</p>
  {% if error %}<div class="mt-5 rounded-lg bg-red-50 p-3 text-sm text-red-700">{{ error }}</div>{% endif %}
  <form method="post" class="mt-6 space-y-4">
    {% csrf_token %}
    <label class="block text-sm font-medium">Usuario
      <input class="form-input mt-1" name="username" autocomplete="username" required autofocus>
    </label>
    <label class="block text-sm font-medium">Contraseña
      <input class="form-input mt-1" type="password" name="password" autocomplete="current-password" required>
    </label>
    <button class="w-full rounded-xl bg-blue-700 px-4 py-3 font-semibold text-white hover:bg-blue-800">Entrar</button>
  </form>
</div>
{% endblock %}
